# Production stack for ONE server (Hetzner): Caddy (automatic HTTPS) -> API (serves the web app) -> PostgreSQL.
# Run from this folder (docker compose finds this file by its name):   docker compose up -d --build   (settings: ./.env, see env.example)
# Nothing but Caddy is reachable from the internet; PostgreSQL and the API only listen on the private Docker network.
name: sng

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets Caddy reach other projects running on this server
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env (your domain, e.g. sng.example.com)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro        # other projects on this server drop a *.caddy file here
      - caddy_data:/data                   # certificates - keep this volume
      - caddy_config:/config
    depends_on:
      - api

  db:
    image: postgres:16
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: sng
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sng
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"   # city names / Russian text need UTF8 (the app refuses to start otherwise)
      LANG: C.UTF-8
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sng -d sng"]
      interval: 5s
      timeout: 3s
      retries: 20
    command: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=768MB", "-c", "effective_cache_size=2GB",
              "-c", "work_mem=8MB", "-c", "log_min_duration_statement=2000"]

  api:
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://sng:${POSTGRES_PASSWORD}@db:5432/sng
      OWNER_EMAILS: ${OWNER_EMAILS:?set OWNER_EMAILS in .env}
      AUTH_SECRET: ${AUTH_SECRET:-}              # phone + PIN sign-in; update.sh generates it once
      TRUST_PROXY: "true"                       # we are behind Caddy: use the real client IP for rate limits
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite,gemini-3.5-flash,gemini-3.8-flash}
      AI_RATE_PER_HOUR: ${AI_RATE_PER_HOUR:-200}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-sng-pro}
      CSP_ENFORCE: ${CSP_ENFORCE:-false}
      # The Mini App is a separate deployment (Vercel, its own repo) calling this API cross-origin -
      # without this, the browser's CORS check refuses every request from that origin. Override in
      # .env if the actual Vercel URL differs from the default guess (custom domain, preview URLs, etc).
      CORS_ORIGINS: ${CORS_ORIGINS:-https://sng-miniapp-web.vercel.app}
    ulimits:
      nofile: 200000

  # @sng_loadboard_bot: buttons only (post/find loads & trucks, account, language, updates) - no Mini
  # App here, see @sngonebot below for that. Start with:  docker compose --profile bot up -d
  bot:
    build:
      context: ..
    command: ["node", "bot/src/index.js"]
    restart: unless-stopped
    profiles: ["bot"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://sng:${POSTGRES_PASSWORD}@db:5432/sng
      API_BASE_URL: http://api:8080
      PUBLIC_WEB_URL: https://${SITE_ADDRESS}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # MINIAPP_URL deliberately NOT set here - @sngonebot is the Mini App's only home (see below).
      # bot/src/index.js resets the menu button to default when this is unset, clearing any Mini App
      # button an earlier deploy of this bot had set.
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:-AIzaSyDryrZCdCuYNZrx8PQe83U4x3YL0Ipz3Hg}
      BOT_ENCRYPTION_KEY: ${BOT_ENCRYPTION_KEY:-}
      BOT_BROADCAST_LANG: ${BOT_BROADCAST_LANG:-uz}
      BOT_JOIN_CHANNEL: ${BOT_JOIN_CHANNEL:-sngOne_yuklar}
      BOT_JOIN_GROUP: ${BOT_JOIN_GROUP:-sngOne_yuklarr}

  # @sngonebot: the Mini App's only home - lean companion (Mini App + login/signup + updates only, see
  # bot/src/config.js's BOT_VARIANT and menu.js's liteKeyboard). Also the one bot process that DMs
  # people about their saved searches (BOT_SEND_SEARCH_ALERTS): anyone who saved a search through the
  # Mini App necessarily has an open chat with this bot (that's what rendered the Mini App), which
  # Telegram requires before a bot can message someone - @sng_loadboard_bot has no such guarantee since
  # it doesn't host the Mini App. Start with:  docker compose --profile sngonebot up -d
  sngonebot:
    build:
      context: ..
    command: ["node", "bot/src/index.js"]
    restart: unless-stopped
    profiles: ["sngonebot"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://sng:${POSTGRES_PASSWORD}@db:5432/sng
      API_BASE_URL: http://api:8080
      PUBLIC_WEB_URL: https://${SITE_ADDRESS}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN_SNGONE:?set TELEGRAM_BOT_TOKEN_SNGONE in .env}
      # Deployed separately on Vercel (its own repo, sng-miniapp-web) - not served from this platform.
      # Override in .env if the real Vercel URL differs from this default guess.
      MINIAPP_URL: ${MINIAPP_URL:-https://sng-miniapp-web.vercel.app}
      BOT_VARIANT: lite
      BOT_SEND_SEARCH_ALERTS: "1"
      BOT_SEND_UPDATES_DIGEST: "1"
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:-AIzaSyDryrZCdCuYNZrx8PQe83U4x3YL0Ipz3Hg}
      BOT_ENCRYPTION_KEY: ${BOT_ENCRYPTION_KEY:-}     # MUST match `bot` above - both decrypt the same telegram_links rows
      BOT_BROADCAST_LANG: ${BOT_BROADCAST_LANG:-uz}
      BOT_JOIN_CHANNEL: ${BOT_JOIN_CHANNEL:-sngOne_yuklar}
      BOT_JOIN_GROUP: ${BOT_JOIN_GROUP:-sngOne_yuklarr}

  # Temporary bridge during a bot-token migration: the OLD bot identity, kept running alongside
  # `bot` above (which now uses the new token) so people who only know the old @username, or groups
  # only the old bot was ever added to, keep working while everyone moves over. Same image, same
  # code, same database - just a different token, in its own env var so it can never collide with
  # `bot`'s TELEGRAM_BOT_TOKEN. telegram_chats is scoped per bot_id (see migration 023), so the two
  # processes never reach into each other's chats. Retire this service (and TELEGRAM_BOT_TOKEN_OLD)
  # once nobody needs the old bot anymore - start with: docker compose --profile bot_old up -d
  bot_old:
    build:
      context: ..
    command: ["node", "bot/src/index.js"]
    restart: unless-stopped
    profiles: ["bot_old"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://sng:${POSTGRES_PASSWORD}@db:5432/sng
      API_BASE_URL: http://api:8080
      PUBLIC_WEB_URL: https://${SITE_ADDRESS}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN_OLD:-}
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:-AIzaSyDryrZCdCuYNZrx8PQe83U4x3YL0Ipz3Hg}
      BOT_ENCRYPTION_KEY: ${BOT_ENCRYPTION_KEY:-}     # MUST match `bot` above - both decrypt the same telegram_links rows
      BOT_BROADCAST_LANG: ${BOT_BROADCAST_LANG:-uz}
      BOT_JOIN_CHANNEL: ${BOT_JOIN_CHANNEL:-sngOne_yuklar}
      BOT_JOIN_GROUP: ${BOT_JOIN_GROUP:-sngOne_yuklarr}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
