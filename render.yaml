# One-click deploy on Render (https://render.com): New + > Blueprint > pick this repository.
# Creates a PostgreSQL database and the web service (built from the Dockerfile) and wires them together.
# You will be asked for the two secrets marked "sync: false". Check Render's current plan names and prices.
databases:
  - name: sng-db
    plan: basic-256mb
    databaseName: sng
    user: sng

services:
  - type: web
    name: sng-one
    runtime: docker
    plan: starter            # always-on (a free web service sleeps, which would drop live connections)
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sng-db
          property: connectionString
      - key: TRUST_PROXY
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"           # raise with the instance size (one worker per CPU)
      - key: OWNER_EMAILS
        sync: false          # e.g. abdujalilov7707@gmail.com
      - key: GEMINI_API_KEY
        sync: false          # from https://aistudio.google.com/apikey (use a NEW key, not one shared in chat)
