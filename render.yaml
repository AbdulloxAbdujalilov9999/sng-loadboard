# One-click deploy on Render (https://render.com): New + > Blueprint > pick this repository.
# Creates a PostgreSQL database, the web service, and the Telegram bot worker, and wires them together.
# You will be asked for the secrets marked "sync: false". Check Render's current plan names and prices.
#
# This is the sng-miniapp TEST deployment: its own database, its own service names, fully isolated
# from the sng-one / sng-loadboard production deployment (see that repo's render.yaml). Nothing here
# shares data with the live site. The ingest bot (a separate, optional service in the main deployment)
# is intentionally left out - copy it over from sng-loadboard/render.yaml if you want it here too.
databases:
  - name: sng-miniapp-db
    plan: basic-256mb
    databaseName: sng_miniapp
    user: sng_miniapp

services:
  - type: web
    name: sng-miniapp
    runtime: docker
    plan: starter            # always-on (a free web service sleeps, which would drop live connections)
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sng-miniapp-db
          property: connectionString
      - key: TRUST_PROXY
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"           # raise with the instance size (one worker per CPU)
      - key: OWNER_EMAILS
        sync: false          # e.g. abdujalilov7707@gmail.com
      - key: GEMINI_API_KEY
        sync: false          # from https://aistudio.google.com/apikey (use a NEW key, not one shared in chat)
      - key: AUTH_SECRET
        sync: false          # 32+ random bytes: openssl rand -base64 48 - required in production (phone+PIN
                             # sign-in AND Telegram Mini App sign-in both depend on this)
      - key: TELEGRAM_BOT_TOKEN
        sync: false          # same token as the bot worker below - needed here too, to verify the signed
                             # data a Telegram Mini App sends on launch

  # The Telegram bot: links members by phone+PIN, posts /postload loads through the API above,
  # broadcasts new loads to groups, and launches the Mini App (/app, and the chat menu button).
  - type: worker
    name: sng-miniapp-telegram-bot
    runtime: docker
    dockerCommand: node bot/src/index.js
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sng-miniapp-db
          property: connectionString
      - key: API_BASE_URL
        sync: false           # the sng-miniapp web service's Render-internal address, e.g. http://sng-miniapp:10000
                               # (Render shows this under that service -> Connect -> Internal; confirm the port it prints)
      - key: PUBLIC_WEB_URL
        value: https://sng-miniapp.onrender.com   # update if Render gave the service a different URL
      - key: MINIAPP_URL
        value: https://sng-miniapp.onrender.com   # same address: the web service also serves the Mini App's web/
      - key: TELEGRAM_BOT_TOKEN
        sync: false           # from @BotFather on Telegram - the same value you set on sng-miniapp above
      - key: FIREBASE_WEB_API_KEY
        value: AIzaSyDryrZCdCuYNZrx8PQe83U4x3YL0Ipz3Hg   # public by design - see web/js/config.js
      - key: BOT_ENCRYPTION_KEY
        sync: false           # 32 random bytes, base64: node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      - key: BOT_BROADCAST_LANG
        value: uz              # en/ru/uz - language used for messages broadcast to groups
