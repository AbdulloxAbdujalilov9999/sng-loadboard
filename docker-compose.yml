# Local / single-host deployment: PostgreSQL + the API (which also serves the web app).
#   OWNER_EMAILS=you@gmail.com docker compose up --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sng
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sng-local-only}
      POSTGRES_DB: sng
      LANG: C.UTF-8
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sng -d sng"]
      interval: 5s
      timeout: 3s
      retries: 20
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=512MB"]

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sng:${POSTGRES_PASSWORD:-sng-local-only}@db:5432/sng
      OWNER_EMAILS: ${OWNER_EMAILS:?set OWNER_EMAILS to the owner Google email}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-auto}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "8080:8080"

  # Optional: the Telegram bot (bot/). Leave TELEGRAM_BOT_TOKEN unset to skip starting it -
  # `docker compose up` still brings up db + api fine; add `--profile bot` once it's configured.
  bot:
    build: .
    command: ["node", "bot/src/index.js"]
    restart: unless-stopped
    profiles: ["bot"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgres://sng:${POSTGRES_PASSWORD:-sng-local-only}@db:5432/sng
      API_BASE_URL: http://api:8080
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:8080}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN to your @BotFather token}
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:-AIzaSyDryrZCdCuYNZrx8PQe83U4x3YL0Ipz3Hg}
      BOT_ENCRYPTION_KEY: ${BOT_ENCRYPTION_KEY:?set BOT_ENCRYPTION_KEY - generate with: node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"}
      BOT_BROADCAST_LANG: ${BOT_BROADCAST_LANG:-uz}
      BOT_JOIN_CHANNEL: ${BOT_JOIN_CHANNEL:-sngOne_yuklar}
      BOT_JOIN_GROUP: ${BOT_JOIN_GROUP:-sngOne_yuklarr}

  # Optional: the Telegram INGEST bot (bot/src/ingestIndex.js) - a separate bot that joins source
  # groups and posts loads it finds there automatically. `--profile ingest` once configured; see
  # bot/README.md "Ingestion bot" and .env.example before turning this on.
  ingest:
    build: .
    command: ["node", "bot/src/ingestIndex.js"]
    restart: unless-stopped
    profiles: ["ingest"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgres://sng:${POSTGRES_PASSWORD:-sng-local-only}@db:5432/sng
      API_BASE_URL: http://api:8080
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:-AIzaSyDryrZCdCuYNZrx8PQe83U4x3YL0Ipz3Hg}
      TELEGRAM_INGEST_BOT_TOKEN: ${TELEGRAM_INGEST_BOT_TOKEN:?set TELEGRAM_INGEST_BOT_TOKEN to a second @BotFather token, privacy mode disabled}
      INGEST_SERVICE_EMAIL: ${INGEST_SERVICE_EMAIL:?set INGEST_SERVICE_EMAIL to a member account you created and approved}
      INGEST_SERVICE_PASSWORD: ${INGEST_SERVICE_PASSWORD:?set INGEST_SERVICE_PASSWORD to that account's password}
      INGEST_ADMIN_TG_IDS: ${INGEST_ADMIN_TG_IDS:-}

  # Optional: the AI paste-import bot (pastebot/) - a third, independent bot: a member pastes or
  # forwards a freight post in DM, it's parsed by the same /api/ai/parse-loads Gemini pipeline the
  # web app's import screen uses, and posted under that member's own account after a one-tap
  # confirm. MUST share the same BOT_ENCRYPTION_KEY as `bot` above - both decrypt the same
  # telegram_links row, so a member linked to one is already linked to both.
  pastebot:
    build: .
    command: ["node", "pastebot/src/index.js"]
    restart: unless-stopped
    profiles: ["pastebot"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgres://sng:${POSTGRES_PASSWORD:-sng-local-only}@db:5432/sng
      API_BASE_URL: http://api:8080
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:8080}
      # pastebot/src/config.js reads TELEGRAM_BOT_TOKEN - map the host's own TELEGRAM_PASTEBOT_TOKEN
      # var onto it so a host-level name clash with the `bot` service above is impossible.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_PASTEBOT_TOKEN:?set TELEGRAM_PASTEBOT_TOKEN to a third @BotFather token}
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:-AIzaSyDryrZCdCuYNZrx8PQe83U4x3YL0Ipz3Hg}
      BOT_ENCRYPTION_KEY: ${BOT_ENCRYPTION_KEY:?set BOT_ENCRYPTION_KEY - the SAME value as the `bot` service above}

volumes:
  pgdata:
