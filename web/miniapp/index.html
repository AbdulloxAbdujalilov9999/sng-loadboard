<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SNG ONE</title>
<link rel="stylesheet" href="app.css?v=__BUILD__">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="gate">
  <div class="spinner"></div>
  <p id="gate-text">Opening your account...</p>
</div>

<div id="app" class="hidden">
  <div id="topbar">
    <span style="font-weight:800;font-size:15px;">SNG ONE</span>
    <select id="lang-select" class="lang">
      <option value="uz">UZ</option><option value="ru">RU</option><option value="en">EN</option>
    </select>
  </div>

  <!-- ===== Dashboard ===== -->
  <section id="view-dashboard" class="view">
    <h1 class="page-h" data-t="dash_title"></h1>
    <p class="page-sub" data-t="dash_sub"></p>
    <div class="tiles">
      <button class="tile blue" data-action="tile-cargo">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <strong data-t="tile_find_cargo"></strong><span data-t="tile_find_cargo_sub"></span>
      </button>
      <button class="tile green" data-action="tile-truck">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="7" width="15" height="10" rx="1"/><path d="M16 10h4l3 3v4h-7z"/><circle cx="6" cy="19" r="1.6"/><circle cx="18" cy="19" r="1.6"/></svg>
        <strong data-t="tile_find_truck"></strong><span data-t="tile_find_truck_sub"></span>
      </button>
      <button class="tile orange" data-action="tile-post">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
        <strong data-t="tile_publish"></strong><span data-t="tile_publish_sub"></span>
      </button>
      <a class="tile dark" id="tile-group" href="https://t.me/sngOne_yuklar" target="_blank" rel="noopener">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        <strong data-t="tile_group"></strong><span data-t="tile_group_sub"></span>
      </a>
    </div>

    <div class="chips" id="dash-chips">
      <div class="chip on" data-kind="all"><span data-t="chip_all"></span><span class="n" id="chip-all-n">–</span></div>
      <div class="chip" data-kind="loads"><span data-t="chip_cargo"></span><span class="n" id="chip-cargo-n">–</span></div>
      <div class="chip" data-kind="trucks"><span data-t="chip_truck"></span><span class="n" id="chip-truck-n">–</span></div>
    </div>

    <div class="quickbar">
      <input class="field" id="dash-from" data-t-ph="ph_from">
      <input class="field" id="dash-to" data-t-ph="ph_to">
      <button class="iconbtn" id="dash-filter-btn" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
    </div>

    <div class="listhead">
      <span data-t="new_listings"></span>
      <span class="link" id="dash-refresh"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0115-3.5L23 10M1 14l4.5 4.5A9 9 0 0020.5 15"/></svg><span data-t="btn_refresh"></span></span>
    </div>
    <div id="dash-feed"></div>
  </section>

  <!-- ===== Search ===== -->
  <section id="view-search" class="view">
    <h1 class="page-h" data-t="search_title"></h1>
    <p class="page-sub" data-t="search_sub"></p>

    <div class="toggle2">
      <button class="seg on" id="search-seg-loads" data-t="chip_cargo"></button>
      <button class="seg" id="search-seg-trucks" data-t="chip_truck"></button>
    </div>

    <div class="card">
      <div class="row2">
        <div>
          <label class="lbl" data-t="ph_from"></label>
          <select class="field" id="search-from-country"></select>
        </div>
        <div>
          <label class="lbl" data-t="ph_to"></label>
          <select class="field" id="search-to-country"></select>
        </div>
      </div>
      <div class="row2">
        <input class="field" id="search-from-city" data-t-ph="ph_city" style="margin-top:8px;">
        <input class="field" id="search-to-city" data-t-ph="ph_city" style="margin-top:8px;">
      </div>
      <label class="lbl" data-t="transport_type"></label>
      <select class="field" id="search-equip">
        <option value="" data-t="opt_any"></option>
        <option value="T">T - Tent</option><option value="R">R - Reefer</option>
        <option value="F">F - Flatbed</option><option value="V">V - Van</option><option value="AC">AC - Car carrier</option>
      </select>
      <div class="btn-row" style="margin-top:12px;">
        <button class="btn btn-primary" id="search-go">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <span id="search-go-text"></span>
        </button>
      </div>
      <div class="btn-row" style="margin-top:8px;">
        <button class="btn btn-soft" id="search-nearby" data-t="btn_nearby"></button>
        <button class="btn btn-ghost" id="search-clear" data-t="btn_clear"></button>
      </div>
      <select class="field hidden" id="search-radius" style="margin-top:8px;">
        <option value="50">50 km</option><option value="100" selected>100 km</option><option value="150">150 km</option>
      </select>
    </div>

    <div class="listhead">
      <span id="search-count"></span>
    </div>
    <div id="search-results"></div>
  </section>

  <!-- ===== Profile (Post has no own tab view - it's the modal below) ===== -->
  <section id="view-profile" class="view">
    <h1 class="page-h" data-t="profile_title"></h1>
    <div class="profile-head">
      <div class="avatar" id="profile-avatar">–</div>
      <div class="name" id="profile-name">–</div>
      <div class="idchip" id="profile-id"></div>
    </div>

    <div class="rowlist">
      <div class="prow" id="row-contacts">
        <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
        <div class="tx"><div class="t1" data-t="row_contacts"></div><div class="t2" id="row-contacts-sub"></div></div>
      </div>
      <div class="prow" id="row-language">
        <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 010 20 15 15 0 010-20z"/></svg></div>
        <div class="tx"><div class="t1" data-t="row_language"></div><div class="t2" id="row-language-sub"></div></div>
      </div>
      <div class="prow" id="row-theme">
        <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg></div>
        <div class="tx"><div class="t1" data-t="row_theme"></div><div class="t2" data-t="row_theme_sub"></div></div>
      </div>
      <div class="prow" id="row-listings">
        <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></div>
        <div class="tx"><div class="t1" data-t="row_listings"></div><div class="t2" id="row-listings-sub" data-t="row_listings_empty"></div></div>
      </div>
      <a class="prow" id="row-support" href="https://t.me/sngOne_yuklarr" target="_blank" rel="noopener">
        <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg></div>
        <div class="tx"><div class="t1" data-t="row_support"></div><div class="t2" data-t="row_support_sub"></div></div>
      </a>
    </div>

    <div class="rowlist">
      <a class="prow" id="row-other-bot" href="https://t.me/sng_loadboard_bot" target="_blank" rel="noopener">
        <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></div>
        <div class="tx"><div class="t1" data-t="row_other_bot"></div></div>
      </a>
      <a class="prow" id="row-platform" href="https://sng-pro.com" target="_blank" rel="noopener">
        <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 010 20 15 15 0 010-20z"/></svg></div>
        <div class="tx"><div class="t1" data-t="row_platform"></div></div>
      </a>
    </div>

    <button class="btn btn-ghost" id="btn-logout" data-t="btn_logout"></button>
  </section>

  <!-- ===== Bottom tab bar ===== -->
  <nav id="tabbar">
    <button class="tab on" data-view="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>
      <span data-t="nav_dashboard"></span>
    </button>
    <button class="tab" data-view="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <span data-t="nav_search"></span>
    </button>
    <button class="tab post" id="tab-post">
      <span class="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg></span>
      <span data-t="nav_post"></span>
    </button>
    <button class="tab" data-view="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span data-t="nav_profile"></span>
    </button>
    <button class="tab" id="tab-placeholder" style="visibility:hidden;">
      <svg viewBox="0 0 24 24"></svg><span>&nbsp;</span>
    </button>
  </nav>
</div>

<!-- ===== Post modal (bottom sheet) ===== -->
<div id="postmodal">
  <div class="backdrop" id="postmodal-backdrop"></div>
  <div class="sheet">
    <div class="sheet-head">
      <h2 data-t="new_listing"></h2>
      <button class="closex" id="postmodal-close">✕</button>
    </div>
    <div class="toggle3">
      <button class="seg on" data-post-tab="text" data-t="tab_as_text"></button>
      <button class="seg" data-post-tab="cargo" data-t="tab_cargo"></button>
      <button class="seg" data-post-tab="truck" data-t="tab_truck"></button>
    </div>

    <div id="post-text" class="post-pane">
      <p class="hint" data-t="paste_hint"></p>
      <textarea class="field" id="post-text-input" data-t-ph="paste_placeholder"></textarea>
      <button class="btn btn-primary" id="post-text-send" style="margin-top:12px;" data-t="btn_send_processing"></button>
      <div id="post-text-review"></div>
    </div>

    <form id="post-cargo" class="post-pane hidden">
      <div class="row2">
        <div><label class="lbl" data-t="ph_from"></label><select class="field" id="pc-from-country"></select><input class="field" id="pc-from-city" data-t-ph="ph_city" style="margin-top:6px;"></div>
        <div><label class="lbl" data-t="ph_to"></label><select class="field" id="pc-to-country"></select><input class="field" id="pc-to-city" data-t-ph="ph_city" style="margin-top:6px;"></div>
      </div>
      <label class="lbl" data-t="lbl_required_transport"></label>
      <select class="field" id="pc-equip"><option value="T">T - Tent</option><option value="R">R - Reefer</option><option value="F">F - Flatbed</option><option value="V">V - Van</option><option value="AC">AC - Car carrier</option></select>
      <div class="row2">
        <div><label class="lbl" data-t="lbl_weight"></label><input class="field" id="pc-weight" type="number" step="0.1" min="0.1" max="100"></div>
        <div><label class="lbl" data-t="lbl_volume"></label><input class="field" id="pc-volume" type="number" step="1" min="1" max="200"></div>
      </div>
      <label class="lbl" data-t="lbl_date"></label>
      <div class="btn-row"><button type="button" class="btn btn-ghost btn-pill" data-pc-date="today" data-t="date_today"></button><button type="button" class="btn btn-ghost btn-pill" data-pc-date="tomorrow" data-t="date_tomorrow"></button></div>
      <div class="dates" id="pc-date-chips"></div>
      <label class="lbl" data-t="lbl_price"></label>
      <input class="field" id="pc-price" type="number" step="1" min="0" data-t-ph="ph_negotiable">
      <label class="lbl" data-t="lbl_additional"></label>
      <textarea class="field" id="pc-notes" data-t-ph="ph_comment" style="min-height:60px;"></textarea>
      <button type="submit" class="btn btn-primary" style="margin-top:14px;" data-t="btn_publish"></button>
    </form>

    <form id="post-truck" class="post-pane hidden">
      <div class="row2">
        <div><label class="lbl" data-t="ph_from"></label><select class="field" id="pt-from-country"></select><input class="field" id="pt-from-city" data-t-ph="ph_city" style="margin-top:6px;"></div>
        <div><label class="lbl" data-t="ph_to"></label><input class="field" id="pt-dest-pref" placeholder="Anywhere"></div>
      </div>
      <label class="lbl" data-t="lbl_transport"></label>
      <select class="field" id="pt-equip"><option value="T">T - Tent</option><option value="R">R - Reefer</option><option value="F">F - Flatbed</option><option value="V">V - Van</option><option value="AC">AC - Car carrier</option></select>
      <div class="row2">
        <div><label class="lbl" data-t="lbl_capacity"></label><input class="field" id="pt-capacity" type="number" step="0.1" min="0.1" max="100"></div>
        <div><label class="lbl" data-t="lbl_volume"></label><input class="field" id="pt-volume" type="number" step="1" min="1" max="200"></div>
      </div>
      <label class="lbl" data-t="lbl_date"></label>
      <div class="btn-row"><button type="button" class="btn btn-ghost btn-pill" data-pt-date="today" data-t="date_today"></button><button type="button" class="btn btn-ghost btn-pill" data-pt-date="tomorrow" data-t="date_tomorrow"></button></div>
      <div class="dates" id="pt-date-chips"></div>
      <label class="lbl" data-t="lbl_additional"></label>
      <textarea class="field" id="pt-notes" data-t-ph="ph_comment" style="min-height:60px;"></textarea>
      <button type="submit" class="btn btn-primary" style="margin-top:14px;" data-t="btn_publish"></button>
    </form>
  </div>
</div>

<script src="../js/config.js?v=__BUILD__"></script>
<script src="../js/util.js?v=__BUILD__"></script>
<script src="i18n.js?v=__BUILD__"></script>
<script src="session-shim.js?v=__BUILD__"></script>
<script src="../js/api.js?v=__BUILD__"></script>
<script src="../js/telegram-miniapp.js?v=__BUILD__"></script>
<script src="app.js?v=__BUILD__"></script>
</body>
</html>
